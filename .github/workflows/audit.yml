name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  audit:
    name: Security Vulnerability Scan (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Security Vulnerability Scan (cargo-audit)
        uses: actions-rust-lang/audit@v1
        with:
          createIssues: false
          # RUSTSEC-2025-0057: fxhash is unmaintained but is an indirect dep via
          # inquire 0.7.x which has not yet migrated away from it. Ignore until
          # inquire releases a version that drops fxhash.
          ignore: RUSTSEC-2025-0057
