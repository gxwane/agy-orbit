name: Security Audit

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

jobs:
  audit:
    name: Security Vulnerability Scan (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: rust-sec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
