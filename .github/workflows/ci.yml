name: CI Quality Gauntlet

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  gauntlet:
    name: Gauntlet on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsecret-1-dev libdbus-1-dev dbus dbus-x11 gnome-keyring

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting (Cargo fmt)
        run: cargo fmt --all --check

      - name: Static Analysis (Cargo Clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Test Suite on Linux (with D-Bus Session & Unlocked Keyring)
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -c "
            rm -rf \$HOME/.local/share/keyrings/
            echo -n 'test' | gnome-keyring-daemon --unlock --components=secrets
            cargo test --all-targets
            cargo test --doc
          "

      - name: Run Test Suite on Windows / macOS
        if: runner.os != 'Linux'
        run: |
          cargo test --all-targets
          cargo test --doc

  msrv:
    name: Verify MSRV (Rust 1.80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsecret-1-dev libdbus-1-dev

      - name: Install Rust 1.80
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.80.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify MSRV Compilation
        run: cargo check --all-targets
